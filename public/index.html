<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>📚 Library Management System</h1>
        <div class="header-actions">
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Search books by title, author, or genre...">
                <button id="searchBtn">🔍</button>
            </div>
            <button id="addBookBtn">➕ Add New Book</button>
        </div>
    </header>

    <!-- Notification -->
    <div id="notification" class="notification"></div>

    <main>
        <div id="booksContainer">
            <div class="container-header">
                <h2>Books Collection</h2>
                <div class="filters">
                    <select id="genreFilter">
                        <option value="">All Genres</option>
                    </select>
                    <select id="statusFilter">
                        <option value="">All Status</option>
                        <option value="available">Available</option>
                        <option value="borrowed">Borrowed</option>
                        <option value="unavailable">Unavailable</option>
                    </select>
                    <button id="clearFilters">Clear Filters</button>
                </div>
            </div>
            <div id="booksList"></div>
        </div>
    </main>

    <!-- Add Book Modal -->
    <div id="addBookModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Add New Book</h2>
            <form id="addBookForm">
                <input type="text" id="title" placeholder="Title" required>
                <input type="text" id="author" placeholder="Author" required>
                <input type="text" id="isbn" placeholder="ISBN" required>
                <input type="number" id="publishedYear" placeholder="Published Year" required>
                <input type="text" id="genre" placeholder="Genre" required>
                <button type="submit">Add Book</button>
            </form>
        </div>
    </div>

    <!-- Edit Book Modal -->
    <div id="editBookModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Edit Book</h2>
            <form id="editBookForm">
                <input type="text" id="editTitle" placeholder="Title" required>
                <input type="text" id="editAuthor" placeholder="Author" required>
                <input type="text" id="editIsbn" placeholder="ISBN" required>
                <input type="number" id="editPublishedYear" placeholder="Published Year" required>
                <input type="text" id="editGenre" placeholder="Genre" required>
                <label>
                    <input type="checkbox" id="editAvailable"> Available
                </label>
                <button type="submit">Update Book</button>
            </form>
        </div>
    </div>

    <!-- Borrow Book Modal -->
    <div id="borrowBookModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Borrow Book</h2>
            <form id="borrowBookForm">
                <input type="text" id="borrowerName" placeholder="Borrower Name" required>
                <input type="email" id="borrowerEmail" placeholder="Borrower Email" required>
                <input type="date" id="dueDate" required>
                <button type="submit">Borrow Book</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
